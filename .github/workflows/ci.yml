# What runs on every push to main and every pull request, on three kinds of GitHub-hosted runner:
# macOS on Apple silicon (`macos-latest`), Linux on x86-64 (`ubuntu-24.04`) and Linux on arm64
# (`ubuntu-24.04-arm`).
#
# The gates, each the command a developer runs by hand:
#
#   - `test`: `zig build test` on all three. It is the lint, every module's unit tests, the
#     conformance suite of each backend the host runs, the halt check, the tools' tests, the bench
#     programs' tests and compile, every example, the hook check and the format check. On macOS the
#     kqueue suite runs. On Linux the io_uring and epoll suites run on the runner's own kernel.
#   - `linux`: the Linux gate, on both Linux processors. The io_uring suites run in the container
#     `tools/linux_test.sh` pins by digest, with `seccomp=unconfined` because Docker's default
#     profile refuses `io_uring_setup`. The epoll suites run under that default profile.
#   - `race`: the same suites under ThreadSanitizer, on both Linux processors. It needs Docker and
#     a dynamic glibc.
#   - `proofs`: `zig build proofs`, the Lean proofs of the timer heap and the timer lifecycle.
#   - `tla`: `zig build tla`, TLC over the model of the sleep handshake and over each of its
#     mutants, which must fail.
#   - `calls`: the kernel calls rotor's echo servers make per echo, counted by the kernel's
#     tracepoints three times and held to `bench/baseline/calls.txt` by `calls_gate`, on both Linux
#     processors.
#   - `commits`: `zig build lint-commits`, on a pull request only.
#
# The proofs and the models do not depend on the processor, so they run on x86-64 only.
#
# Two more jobs run only when asked, on x86-64 only. `comparison` runs every night and by hand, and
# holds rotor's echo throughput against libuv and libxev to `bench/baseline/echo.txt`. `costs` runs
# by hand.
#
# **The cost gate rides in the conformance suite** (`src/conformance/conformance_cost.zig`), so
# every `test` and `linux` job bounds the loop's own work: a poll, a timer fire and a submit.
# Each bound is checked against the best of twenty attempts and sits an order of magnitude above
# what was measured, so a busy runner costs attempts and not a false failure. A failure here is a
# regression. If one of these ever proves flaky the answer is to raise that bound deliberately,
# with the number and the machine beside it, and never to retry until it passes.
#
# **No number from CI enters `docs/costs.md`.** Rule 1 of that file stands: a measured cell comes
# from a probe run on a named machine. These runners are neither named nor quiet, and the gate
# above is a tripwire and not a measurement.
#
# Zig is installed by `.github/actions/zig`, which downloads it from ziglang.org and checks it
# against the SHA-256 the release index published for 0.16.0 on the runner's system and processor.
# So the toolchain is pinned as the container and the alternatives are. No third-party action runs
# here; `actions/checkout` is GitHub's own. Every job has a time limit several times its usual
# length, so a test that hangs ends the job instead of holding the runner for six hours.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every night at 06:17 UTC, for the comparison job below; every other job runs then too. The
  # minute is off the hour, when GitHub starts fewer scheduled runs late.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  test:
    name: zig build test, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-latest }
          - { name: Linux x86-64, runner: ubuntu-24.04 }
          - { name: Linux arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: The whole local gate
        run: zig build test

  linux:
    name: Linux gate, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: Build the Linux test executables
        run: zig build test-linux
      # A consumer reported on 2026-09-22 that GitHub's runners "disable io_uring". On this image
      # they do not: the cost and comparison jobs measure rows C7 and C17 natively and run rotor's
      # io_uring echo, whose server is built on the io_uring backend itself and so cannot fall back
      # to epoll. What does refuse io_uring_setup is
      # Docker's default seccomp profile, which is why the step below passes seccomp=unconfined.
      # This step prints both facts so a run's log answers the question without anyone guessing.
      # It never fails the job: it reports what the runner allows, it does not require anything.
      - name: Whether this runner allows io_uring without a container
        run: |
          sysctl_path=/proc/sys/kernel/io_uring_disabled
          if [ -r "$sysctl_path" ]; then
            echo "io_uring_disabled: $(cat $sysctl_path) (0 allows, 1 needs CAP_SYS_ADMIN, 2 forbids)"
          else
            echo "io_uring_disabled: absent, so this kernel predates the 6.6 switch"
          fi
          if ./zig-out/linux/uring_probe; then
            echo "native io_uring: every feature the loop needs is present, no container involved"
          else
            echo "native io_uring: refused; the probe named the first missing feature above"
          fi

      - name: Run them against a real kernel
        run: bash tools/linux_test.sh

  race:
    name: ThreadSanitizer, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: Build the sanitized executables
        run: zig build test-race
      - name: Run them
        run: bash tools/race_test.sh

  # The Lean proofs in proofs/. Lean is downloaded from its GitHub release and checked against the
  # SHA-256 GitHub publishes for the asset, as Zig is checked against the release index's.
  proofs:
    name: Lean proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEAN_VERSION: "4.34.0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: Install Lean
        run: |
          set -euo pipefail
          name="lean-${LEAN_VERSION}-linux"
          url="https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/${name}.tar.zst"
          sha="caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b"
          curl -fsSL "$url" -o lean.tar.zst
          echo "$sha  lean.tar.zst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf lean.tar.zst
          echo "$PWD/${name}/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - name: Check the proofs
        run: zig build proofs

  # The TLA+ models in spec/tla/. TLC runs on the Java the image carries, and the tool fetches the
  # jar it pins and checks its SHA-256 (`tools/tla.zig`).
  tla:
    name: TLA+ models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - run: java -version
      - name: Check the models, and refuse every mutant
        run: zig build tla

  # Started by hand, because it takes minutes and answers a question rather than guarding a
  # change. The runner is x86-64 Linux, which is the architecture rotor's deployment target is and
  # which no machine this project has measured on shares: `mac` and `orbstack` are both Apple
  # silicon. What it prints is read into `bench/results/` by hand, with the CPU the run reported,
  # because a hosted runner gives whichever processor its pool had.
  costs:
    name: Linux x86-64, cost probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; uname -r; grep -m1 MemTotal /proc/meminfo
      - name: The probes
        run: zig build bench-costs
      # `uring_nop_no_class_a` is ReleaseSafe with decision 8's class A assertions compiled out, so
      # its difference from `uring_nop_safe` is what class A costs (that record's step 2).
      - name: Decision 8's experiment, five rounds alternating
        run: |
          set -euo pipefail
          zig build bench-linux
          for round in 1 2 3 4 5; do
            echo "== round $round"
            ./zig-out/linux-bench/uring_nop_safe
            ./zig-out/linux-bench/uring_nop_fast
            ./zig-out/linux-bench/uring_nop_no_class_a
          done
      # Decision 13's idle case: what a loop that polls for 50 us before it sleeps costs when its
      # next message comes later than that. `rotor_post --gap-us` waits that long before each ping,
      # and prints the CPU time the answering loop used per round trip on its `rotor_post:` line.
      # The 1,500 us gap is not a multiple of the program's 1 ms wait, so a ping there never
      # arrives as a wait ends.
      - name: Decision 13's idle case, three rounds alternating
        run: |
          set -euo pipefail
          zig build bench-crosscore
          for round in 1 2 3; do
            echo "== round $round"
            for gap in 0 20 100 1000 1500; do
              for mode in waiting spin-then-wait spin-budget spinning; do
                ./zig-out/bin/rotor_post --mode "$mode" --gap-us "$gap" --samples 2000 --warmup 200 \
                  | grep -E '^rotor_post:|^[{]'
              done
            done
          done
      # The same on epoll, the backend a process runs where the kernel refuses io_uring
      # (decision 20). `post_epoll` is `rotor_post` built against it, by `zig build bench-linux`.
      - name: Decision 13's idle case on epoll, three rounds alternating
        run: |
          set -euo pipefail
          zig build bench-linux
          for round in 1 2 3; do
            echo "== epoll, round $round"
            for gap in 0 20 100 1000 1500; do
              for mode in waiting spin-then-wait spin-budget spinning; do
                ./zig-out/linux-bench/post_epoll --mode "$mode" --gap-us "$gap" --samples 2000 \
                  --warmup 200 | grep -E '^rotor_post:|^[{]'
              done
            done
          done
      # Decision 21: one message between loops of two processes against the same between two
      # threads, alternating, on io_uring (`rotor_post`) and on epoll (`post_epoll`). The peer that
      # waits pays a wake each message; the peer that spins pays none, which isolates the crossing.
      - name: Decision 21, a message between processes, three rounds alternating
        run: |
          set -euo pipefail
          zig build bench-crosscore bench-linux
          for round in 1 2 3; do
            for program in ./zig-out/bin/rotor_post ./zig-out/linux-bench/post_epoll; do
              for mode in waiting spinning; do
                for peer in thread process; do
                  echo "== round $round, $program, $mode, peer $peer"
                  "$program" --mode "$mode" --peer "$peer" --samples 2000 --warmup 200 \
                    | grep -E '^rotor_post:|^[{]'
                done
              done
            done
          done
      # Decision 8's echo half: rotor's echo server at 4 KiB with class A compiled out, against the
      # one rotor ships. Both are named `rotor`, and the runner alternates candidates only inside
      # one run, so the two runs alternate here, three times each, each on its own ports.
      - name: Decision 8's echo half, three rounds alternating
        run: |
          set -euo pipefail
          zig build bench-echo bench-echo-no-class-a
          ls -l zig-out/bin/rotor_echo zig-out/no-class-a/rotor_echo
          for round in 1 2 3; do
            echo "== round $round, class A on"
            ./zig-out/bin/echo_runner --candidates rotor --payloads 4096 \
              --port-base $((20000 + round * 200))
            echo "== round $round, class A off"
            ./zig-out/bin/echo_runner --candidates rotor --payloads 4096 \
              --port-base $((20100 + round * 200)) --directory zig-out/no-class-a
          done
      # The same on epoll (decision 20): both servers are built on epoll, class A on and off. The
      # runner's own client stays on io_uring for both.
      - name: Decision 8's echo half on epoll, three rounds alternating
        run: |
          set -euo pipefail
          zig build bench-echo bench-echo-epoll-class-a
          ls -l zig-out/epoll-class-a/rotor_echo zig-out/epoll-no-class-a/rotor_echo
          for round in 1 2 3; do
            echo "== epoll, round $round, class A on"
            ./zig-out/bin/echo_runner --candidates rotor --payloads 4096 \
              --port-base $((22000 + round * 200)) --directory zig-out/epoll-class-a
            echo "== epoll, round $round, class A off"
            ./zig-out/bin/echo_runner --candidates rotor --payloads 4096 \
              --port-base $((22100 + round * 200)) --directory zig-out/epoll-no-class-a
          done

  # Every night, and when started by hand. It compares rotor on io_uring against libuv and libxev
  # in one run on one runner, and holds the echo rows to `bench/baseline/echo.txt`, whose sections
  # were taken from this job on 2026-09-22.
  #
  # It leaves the file workload out. Those rows read a file on an Azure cloud volume, which is what
  # keeps C12 and C13 out of the `github` column of `docs/costs.md`, and a number from it would
  # describe the volume rather than either library.
  comparison:
    name: Linux x86-64, the comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; uname -r
      - name: Build rotor's programs and the pinned alternatives
        run: |
          set -euo pipefail
          zig build bench-echo
          zig build bench-crosscore
          zig build bench-alternatives
      # Held to `bench/baseline/echo.txt`, so a comparison checks itself: a candidate that gained on
      # rotor past the margin fails this step and names the row. The baseline records ratios between
      # candidates of one run, never throughputs, and one section of them per processor, because
      # this pool hands out a different processor each time and the ratios move with it
      # (`bench/harness/baseline.zig`). A run on a processor the file does not name is held to
      # nothing and prints its section instead. It runs every night rather than on every push: the
      # comparison takes about half an hour of a runner, and the calls job catches an added call per
      # echo on every push already.
      - name: Echo, against the baseline
        run: ./zig-out/bin/echo_runner --baseline bench/baseline/echo.txt
      # The steps below measure other workloads, so they run whatever the echo gate decided.
      - name: Accept storm
        if: ${{ !cancelled() }}
        run: ./zig-out/bin/echo_runner --workload storm --port-base 31000
      - name: Timer churn, each library in its cheapest mode
        if: ${{ !cancelled() }}
        run: ./zig-out/bin/timers_runner
      - name: One cross-core message
        if: ${{ !cancelled() }}
        run: ./zig-out/bin/crosscore_runner
      # The two measurements `bench/calls/` made on `orbstack`, taken here too. On 2026-09-22 this
      # runner showed rotor's group and accumulate shapes level, where `orbstack` showed the whole-
      # pool group well behind, and its CPU table showed why: a whole-pool group costs this runner's
      # server no more than a small one (`bench/results/cpu-github-2026-09-22.md`).
      - name: CPU per echo, server and client
        if: ${{ !cancelled() }}
        run: BIN=zig-out/bin sh bench/calls/cpu_per_echo.sh
      - name: Kernel calls per echo
        if: ${{ !cancelled() }}
        run: sudo BIN=zig-out/bin sh bench/calls/count_calls.sh

  # Kernel calls per echo, held to `bench/baseline/calls.txt` on every push and pull request. A
  # count per echo moves far less with the runner's load than a time does, so this is the speed
  # check steady enough to run on every change (`bench/calls/calls_gate.zig`). It counts rotor's
  # own echo servers only: io_uring, and epoll with each receive shape. Each of three rounds runs
  # every row, and the gate judges the smallest count any round gave, because other work on the
  # runner raises some rounds and a change that adds a call raises all of them.
  calls:
    name: Calls per echo, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, runner: ubuntu-24.04 }
          - { name: Linux arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || grep -m2 -E "CPU (implementer|part)" /proc/cpuinfo
          nproc; uname -r
      - name: Build rotor's echo servers, the client and the gate
        run: zig build bench-echo
      # One second per row: at three, an epoll row made events faster than the trace reader took
      # them on EPYC 7763 runners, and every round of that row lost some, which the gate refuses.
      - name: Count three rounds
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            sudo SECONDS_PER_RUN=1 BIN=zig-out/bin sh bench/calls/count_calls.sh |
              tee "calls-$round.md"
          done
      - name: Hold the counts to the baseline
        run: ./zig-out/bin/calls_gate bench/baseline/calls.txt calls-1.md calls-2.md calls-3.md

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/zig
      - name: Every commit of this branch is a Conventional Commit
        run: zig build lint-commits
