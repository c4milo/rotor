# What runs on every push to main and every pull request.
#
# Three gates, the same three a developer runs by hand:
#
#   - `macos`: `zig build test`, which is the lint, every module's unit tests, the kqueue
#     conformance suite, the halt check, the tools' tests, the bench compile, the hook check and
#     the format check.
#   - `linux`: the io_uring conformance suite and the uring unit tests, in the container
#     `tools/linux_test.sh` pins by digest, with `seccomp=unconfined` because Docker's default
#     profile refuses `io_uring_setup`.
#   - `race`: the same suites under ThreadSanitizer, which needs Docker and a dynamic glibc.
#
# **The cost gate rides in the conformance suite** (`src/conformance/conformance_cost.zig`), so
# both the macOS and the Linux job bound the loop's own work: a poll, a timer fire and a submit.
# Each bound is checked against the best of twenty attempts and sits an order of magnitude above
# what was measured, so a busy runner costs attempts and not a false failure. A failure here is a
# regression. If one of these ever proves flaky the answer is to raise that bound deliberately,
# with the number and the machine beside it, and never to retry until it passes.
#
# **No number from CI enters `docs/costs.md`.** Rule 1 of that file stands: a measured cell comes
# from a probe run on a named machine. These runners are neither named nor quiet, and the gate
# above is a tripwire and not a measurement.
#
# Zig is downloaded from ziglang.org and checked against the SHA-256 the release index published
# for 0.16.0, so the toolchain is pinned as the container and the alternatives are. No third-party
# action runs here; `actions/checkout` is GitHub's own.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  macos:
    name: macOS, kqueue
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          sha="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: The whole local gate
        run: zig build test

  linux:
    name: Linux, io_uring
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig version
      - name: Build the Linux test executables
        run: zig build test-linux
      # A consumer reported on 2026-09-22 that GitHub's runners "disable io_uring". On this image
      # they do not: the cost and comparison jobs measure rows C7 and C17 natively and run rotor's
      # io_uring echo, and rotor has no fallback to hide behind. What does refuse io_uring_setup is
      # Docker's default seccomp profile, which is why the step below passes seccomp=unconfined.
      # This step prints both facts so a run's log answers the question without anyone guessing.
      # It never fails the job: it reports what the runner allows, it does not require anything.
      - name: Whether this runner allows io_uring without a container
        run: |
          sysctl_path=/proc/sys/kernel/io_uring_disabled
          if [ -r "$sysctl_path" ]; then
            echo "io_uring_disabled: $(cat $sysctl_path) (0 allows, 1 needs CAP_SYS_ADMIN, 2 forbids)"
          else
            echo "io_uring_disabled: absent, so this kernel predates the 6.6 switch"
          fi
          if ./zig-out/linux/uring_probe; then
            echo "native io_uring: every feature the loop needs is present, no container involved"
          else
            echo "native io_uring: refused; the probe named the first missing feature above"
          fi

      - name: Run them against a real kernel
        run: bash tools/linux_test.sh

  race:
    name: Linux, ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build the sanitized executables
        run: zig build test-race
      - name: Run them
        run: bash tools/race_test.sh

  # Started by hand, because it takes minutes and answers a question rather than guarding a
  # change. The runner is x86-64 Linux, which is the architecture rotor's deployment target is and
  # which no machine this project has measured on shares: `mac` and `orbstack` are both Apple
  # silicon. What it prints is read into `bench/results/` by hand, with the CPU the run reported,
  # because a hosted runner gives whichever processor its pool had.
  costs:
    name: Linux x86-64, cost probes
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; uname -r; grep -m1 MemTotal /proc/meminfo
      - name: The probes
        run: zig build bench-costs
      - name: Decision 8's experiment, five rounds alternating
        run: |
          set -euo pipefail
          zig build bench-linux
          for round in 1 2 3 4 5; do
            echo "== round $round"
            ./zig-out/linux-bench/uring_nop_safe
            ./zig-out/linux-bench/uring_nop_fast
          done

  # Also started by hand. The comparison against libuv and libxev has never been run on io_uring
  # anywhere: the rows in `bench/alternatives/README.md` marked io_uring were withdrawn, and every
  # row since was taken on macOS. This job is where that changes.
  #
  # It leaves the file workload out. Those rows read a file on an Azure cloud volume, which is what
  # keeps C12 and C13 out of the `github` column of `docs/costs.md`, and a number from it would
  # describe the volume rather than either library.
  comparison:
    name: Linux x86-64, the comparison
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: What this runner is
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          nproc; uname -r
      - name: Build rotor's programs and the pinned alternatives
        run: |
          set -euo pipefail
          zig build bench-echo
          zig build bench-crosscore
          zig build bench-alternatives
      - name: Echo
        run: ./zig-out/bin/echo_runner
      - name: Accept storm
        run: ./zig-out/bin/echo_runner --workload storm --port-base 31000
      - name: Timer churn, each library in its cheapest mode
        run: ./zig-out/bin/timers_runner
      - name: One cross-core message
        run: ./zig-out/bin/crosscore_runner

  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Zig
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Every commit of this branch is a Conventional Commit
        run: zig build lint-commits
