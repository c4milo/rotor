\* expect: holds
\* One sender and two workers, each sending three messages through a ring of two: a sender's flush
\* that pushes twice before its one wake.
CONSTANTS
    Senders = {s1}
    Workers = {w1, w2}
    Messages = 3
    Capacity = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWake
PROPERTY Delivered
CHECK_DEADLOCK FALSE
