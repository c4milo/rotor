\* expect: holds
\* Two senders and one worker, each sending two messages through a ring of one: every push to a
\* full ring waits for a drain, and the two flags are both in play.
CONSTANTS
    Senders = {s1, s2}
    Workers = {w1}
    Messages = 2
    Capacity = 1
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWake
PROPERTY Delivered
CHECK_DEADLOCK FALSE
