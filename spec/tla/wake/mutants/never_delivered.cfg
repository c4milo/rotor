\* expect: violated
\* module: WakeMutants
\* A flush sends no wake, checked against `Delivered` alone: the receiver stays blocked with a
\* message in its ring, which shows the fairness of `Spec` does not hand the message over by itself.
CONSTANTS
    Senders = {s1}
    Workers = {}
    Messages = 2
    Capacity = 1
    EndFlush <- EndFlushNoWake
SPECIFICATION Spec
PROPERTY Delivered
CHECK_DEADLOCK FALSE
