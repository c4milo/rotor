\* expect: holds
\* Three senders and no offload, each sending two messages through a ring of one: the receiver
\* goes straight to the registry's flag.
CONSTANTS
    Senders = {s1, s2, s3}
    Workers = {}
    Messages = 2
    Capacity = 1
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWake
PROPERTY Delivered
CHECK_DEADLOCK FALSE
